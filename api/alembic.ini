# Alembic設定ファイル

[alembic]
# マイグレーションスクリプトの配置場所
script_location = alembic

# テンプレートファイル
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# タイムゾーン
timezone = Asia/Tokyo

# トランケートするかどうか
truncate_slug_length = 40

# リビジョンIDの形式
revision_environment = false

# データベースURL（環境変数から取得）
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# マイグレーションファイル作成後のフック
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
